# Olist PostgreSQL - Definitive Schema Catalog
# Source of truth for exact table/column names, data types, FK relationships, and enums.
# Injected verbatim into every SQL generation prompt so the model never guesses names.
# All date/datetime columns are TIMESTAMP (migrated from TEXT in the SQLite v1).
# Use TO_CHAR()/DATE_TRUNC()/EXTRACT() for date logic in PostgreSQL (never strftime/julianday).

tables:

  orders:
    description: "One row per order placed by a customer."
    columns:
      order_id:
        type: TEXT
        note: "primary key"
      customer_id:
        type: TEXT
        note: "FK to customers.customer_id — NOT customer_unique_id"
      order_status:
        type: TEXT
        enum: [approved, canceled, created, delivered, invoiced, processing, shipped, unavailable]
      order_purchase_timestamp:
        type: TEXT
        note: "timestamp; use TO_CHAR(col, 'YYYY-MM') to group by month"
      order_approved_at:
        type: TEXT
        note: "timestamp; nullable"
      order_delivered_carrier_date:
        type: TEXT
        note: "timestamp; nullable"
      order_delivered_customer_date:
        type: TEXT
        note: "timestamp; nullable"
      order_estimated_delivery_date:
        type: TEXT
        note: "timestamp; nullable"

  customers:
    description: "One row per customer_id. A single person may have multiple customer_ids."
    columns:
      customer_id:
        type: TEXT
        note: "primary key; this is the join key to orders.customer_id"
      customer_unique_id:
        type: TEXT
        note: "de-duplicated person identity; NOT used as a join key to orders"
      customer_zip_code_prefix:
        type: INTEGER
      customer_city:
        type: TEXT
      customer_state:
        type: TEXT
        note: "2-letter Brazilian state code (e.g. SP, RJ, MG)"

  order_items:
    description: "One row per item within an order. An order can have multiple items."
    columns:
      order_id:
        type: TEXT
        note: "FK to orders.order_id"
      order_item_id:
        type: INTEGER
        note: "sequential item number within the order; starts at 1"
      product_id:
        type: TEXT
        note: "FK to products.product_id"
      seller_id:
        type: TEXT
        note: "FK to sellers.seller_id"
      shipping_limit_date:
        type: TEXT
        note: "timestamp"
      price:
        type: REAL
        note: "item price in BRL"
      freight_value:
        type: REAL
        note: "freight cost for this item in BRL"

  order_payments:
    description: "One row per payment entry. An order can have multiple rows (installments or mixed payment types)."
    columns:
      order_id:
        type: TEXT
        note: "FK to orders.order_id"
      payment_sequential:
        type: INTEGER
        note: "sequence number for this payment within the order"
      payment_type:
        type: TEXT
        enum: [boleto, credit_card, debit_card, not_defined, voucher]
      payment_installments:
        type: INTEGER
        note: "number of installments chosen"
      payment_value:
        type: REAL
        note: "total value for this payment row in BRL"

  order_reviews:
    description: "Customer review per order. At most one review per order in this dataset."
    columns:
      review_id:
        type: TEXT
        note: "primary key"
      order_id:
        type: TEXT
        note: "FK to orders.order_id"
      review_score:
        type: INTEGER
        note: "1 to 5 star rating"
      review_comment_title:
        type: TEXT
        note: "nullable"
      review_comment_message:
        type: TEXT
        note: "nullable"
      review_creation_date:
        type: TEXT
        note: "timestamp; use this for time-based grouping of reviews"
      review_answer_timestamp:
        type: TEXT
        note: "timestamp; nullable"

  products:
    description: "Product catalogue. One row per product_id."
    columns:
      product_id:
        type: TEXT
        note: "primary key"
      product_category_name:
        type: TEXT
        note: "Portuguese category name; join to product_category_name_translation for English; examples: 'eletronicos' (electronics), 'esporte_lazer' (sports_leisure), 'livros_interesse_geral' (books_general_interest), 'beleza_saude' (health_beauty) "
      product_name_lenght:
        type: REAL
        note: "character count of product name — intentional typo in DB, use exactly this spelling"
      product_description_lenght:
        type: REAL
        note: "character count of description — intentional typo in DB, use exactly this spelling"
      product_photos_qty:
        type: REAL
        note: "number of product photos"
      product_weight_g:
        type: REAL
      product_length_cm:
        type: REAL
      product_height_cm:
        type: REAL
      product_width_cm:
        type: REAL

  sellers:
    description: "Seller (merchant) master. One row per seller_id."
    columns:
      seller_id:
        type: TEXT
        note: "primary key"
      seller_zip_code_prefix:
        type: INTEGER
      seller_city:
        type: TEXT
      seller_state:
        type: TEXT
        note: "2-letter Brazilian state code"

  product_category_name_translation:
    description: "Maps Portuguese product category names to English. One row per category.Maps Portuguese category names to English equivalents. Use this table whenever filtering products by English category names like 'electronics', 'sports_leisure', 'books_general_interest'."
    columns:
      product_category_name:
        type: TEXT
        note: "Portuguese name; joins to products.product_category_name"
      product_category_name_english:
        type: TEXT
        note: "English translation"

  geolocation:
    description: "Lat/lng lookup by zip code prefix. Multiple rows per prefix."
    columns:
      geolocation_zip_code_prefix:
        type: INTEGER
      geolocation_lat:
        type: REAL
      geolocation_lng:
        type: REAL
      geolocation_city:
        type: TEXT
      geolocation_state:
        type: TEXT

  leads_qualified:
    description: "Marketing qualified leads (MQLs). One row per mql_id."
    columns:
      mql_id:
        type: TEXT
        note: "primary key"
      first_contact_date:
        type: TEXT
        note: "timestamp"
      landing_page_id:
        type: TEXT
      origin:
        type: TEXT
        enum: [direct_traffic, display, email, organic_search, other, other_publicities, paid_search, referral, social, unknown]

  leads_closed:
    description: "Leads that converted to sellers (won deals). One row per mql_id."
    columns:
      mql_id:
        type: TEXT
        note: "primary key; FK to leads_qualified.mql_id"
      seller_id:
        type: TEXT
        note: "FK to sellers.seller_id; populated after conversion"
      sdr_id:
        type: TEXT
        note: "sales development rep ID"
      sr_id:
        type: TEXT
        note: "sales rep ID"
      won_date:
        type: TEXT
        note: "timestamp"
      business_segment:
        type: TEXT
        enum: [air_conditioning, audio_video_electronics, baby, bags_backpacks, bed_bath_table, books, car_accessories, computers, construction_tools_house_garden, fashion_accessories, food_drink, food_supplement, games_consoles, gifts, handcrafted, health_beauty, home_appliances, home_decor, home_office_furniture, household_utilities, jewerly, music_instruments, other, party, perfume, pet, phone_mobile, religious, small_appliances, sports_leisure, stationery, toys, watches]
      lead_type:
        type: TEXT
        enum: [industry, offline, online_beginner, online_big, online_medium, online_small, online_top, other]
      lead_behaviour_profile:
        type: TEXT
        note: "nullable"
      has_company:
        type: INTEGER
        note: "0 or 1 (boolean)"
      has_gtin:
        type: INTEGER
        note: "0 or 1 (boolean)"
      average_stock:
        type: TEXT
        note: "nullable"
      business_type:
        type: TEXT
        enum: [manufacturer, other, reseller]
      declared_product_catalog_size:
        type: REAL
        note: "nullable"
      declared_monthly_revenue:
        type: REAL
        note: "nullable"

# Foreign key relationships — exact join columns; do not substitute
relationships:
  - from: "orders.customer_id"
    to: "customers.customer_id"
  - from: "order_items.order_id"
    to: "orders.order_id"
  - from: "order_items.product_id"
    to: "products.product_id"
  - from: "order_items.seller_id"
    to: "sellers.seller_id"
  - from: "order_payments.order_id"
    to: "orders.order_id"
  - from: "order_reviews.order_id"
    to: "orders.order_id"
  - from: "products.product_category_name"
    to: "product_category_name_translation.product_category_name"
  - from: "leads_closed.mql_id"
    to: "leads_qualified.mql_id"
  - from: "leads_closed.seller_id"
    to: "sellers.seller_id"

# Multi-hop cross-domain join paths
# These document how to traverse BETWEEN business domains (orders ↔ leads, etc.).
# There is NO direct join between orders and leads tables — sellers is the bridge entity.
# Always use these paths when a question spans multiple domains.

cross_domain_paths:
  - name: "orders_to_leads"
    description: >
      Sellers appear in both the orders domain (via order_items) and the leads domain
      (via leads_closed). To connect orders to leads you MUST go through sellers.
      There is NO direct join from orders or customers to leads_qualified or leads_closed.
    path: "orders -> order_items (order_id) -> leads_closed (seller_id) -> leads_qualified (mql_id)"
    example_use: >
      'How many leads were generated from orders placed in a given period?'
      Join orders to order_items on order_id, then order_items to leads_closed on seller_id,
      then leads_closed to leads_qualified on mql_id.
      Apply date and customer_state filters on the orders/customers side.

  - name: "orders_to_seller_leads_with_customer_filter"
    description: >
      When filtering by customer state AND linking to leads, you need BOTH the customer
      join (for state) and the seller-lead join path. customers does not join to leads.
    path: "orders -> customers (customer_id) [for state filter] + orders -> order_items (order_id) -> leads_closed (seller_id) -> leads_qualified (mql_id)"
    example_use: >
      'How many leads came from orders placed by customers in SP, BA, MA?'
      JOIN customers for the state filter, JOIN order_items then leads_closed then leads_qualified
      for the lead count. Use DISTINCT on mql_id or seller_id to avoid duplicates.

  - name: "orders_to_products_to_category"
    description: >
      To get English product category names, you must go through
      product_category_name_translation. Products only store the Portuguese name.
    path: "order_items -> products (product_id) -> product_category_name_translation (product_category_name)"
    example_use: >
      'Revenue by product category in English?'
      Join order_items to products on product_id, then products to
      product_category_name_translation on product_category_name.

  - name: "leads_to_seller_orders"
    description: >
      To find orders placed by sellers who are in the leads pipeline (reverse direction).
    path: "leads_qualified -> leads_closed (mql_id) -> order_items (seller_id) -> orders (order_id)"
    example_use: >
      'What is the order volume from sellers who converted from leads?'

# Common pitfalls — mistakes the model must avoid
pitfalls:
  - "Join to customers using orders.customer_id = customers.customer_id, NOT customer_unique_id."
  - "order_items has no payment or review columns — always join through orders to reach order_payments or order_reviews."
  - "The column names product_name_lenght and product_description_lenght are intentionally misspelled in the database — use exactly these spellings."
  - "All date columns are TIMESTAMP. Use TO_CHAR(col, 'YYYY-MM') to group by month, and EXTRACT(EPOCH FROM (a - b)) / 86400.0 for day differences."
  - "order_payments can have multiple rows per order_id. Use SUM(payment_value) and GROUP BY order_id before joining to avoid row multiplication."
  - "There is NO direct join between orders/customers and leads_qualified/leads_closed. The only bridge is seller_id: orders -> order_items -> leads_closed -> leads_qualified."
  - "Do NOT join leads_qualified to orders on a date or NULL condition. leads_qualified has no order_id column."
  - "When counting leads linked to orders, use COUNT(DISTINCT lq.mql_id) or COUNT(DISTINCT lc.seller_id) to avoid row multiplication from multiple items per order."
  - "REVENUE BY CATEGORY: Use SUM(order_items.price) for item-level revenue. Do NOT use SUM(order_payments.payment_value) when joining with order_items — payment_value is order-level and causes double-counting across multiple items."
  - "CATEGORY NAMES: products.product_category_name is in PORTUGUESE. To filter by English names (e.g. 'electronics', 'sports_leisure', 'books_general_interest'), you MUST JOIN product_category_name_translation ON products.product_category_name = pct.product_category_name and filter on pct.product_category_name_english. NEVER do WHERE product_category_name = 'electronics'."
  - "DELIVERY TIME vs DELAY: Delivery time from purchase = EXTRACT(EPOCH FROM (order_delivered_customer_date - order_purchase_timestamp)) / 86400.0. Do NOT subtract order_estimated_delivery_date — that gives delay (lateness), not delivery time."
  - "LEADS DATE FILTER: When filtering leads by a time period via first_contact_date, do NOT also restrict leads_closed.won_date to the same period — a lead qualified in Q4 may close in a future quarter. Only filter won_date if the question explicitly asks for it."
  - "PRODUCTS WITH NO REVIEWS: LEFT JOIN order_items ON product_id, then orders ON order_id, then order_reviews ON order_id, and filter WHERE order_reviews.review_id IS NULL. Do NOT use NOT IN (SELECT order_id FROM order_reviews) — that compares product_id to order_id."
  - "DELIVERED ORDER COUNT: To count successfully delivered orders, filter WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL."
