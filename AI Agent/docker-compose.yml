# Local Postgres 16 with the pgvector extension (v2 data layer).
# Usage: docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: olist-postgres
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER:-olist_admin}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:-olist_admin_pw}
      POSTGRES_DB: ${PG_DB:-olist}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ADMIN_USER:-olist_admin} -d ${PG_DB:-olist}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
